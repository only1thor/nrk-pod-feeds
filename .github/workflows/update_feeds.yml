name: update-podcast-feeds

on:
  workflow_dispatch:
  schedule:
   - cron: '15 * * * *'
   # Denser polling 05:45-06:55 Oslo time to catch early-morning episodes sooner.
   # Workaround to compensate for daylight savings (see discover_feeds.yml).
   - cron: '45,55 3 * 4-10 *' # April through October (CEST, UTC+2)
   - cron: '5,15,25,35,45,55 4 * 4-10 *'
   - cron: '45,55 4 * 11,12,1,2,3 *' # November through March (CET, UTC+1)
   - cron: '5,15,25,35,45,55 5 * 11,12,1,2,3 *'

jobs:
  update-feeds:
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
          cache: 'pip'
          
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute feed generation script
        run: python generate_feeds.py
          
      - name: Auto-commit changes and push
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(auto): Update podcast feed(s)"
          commit_author: Feed Updater <actions@github.com>
          file_pattern: docs/
